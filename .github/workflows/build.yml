name: Build signed-ready apps
on:
  workflow_dispatch:
  push:
    branches: [main, 'codex/**']
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - name: Build, test, and package Windows and Chrome
        shell: pwsh
        run: ./scripts/build-windows.ps1
      - name: Require installer
        shell: pwsh
        run: if (-not (Test-Path artifacts/BiliRemote-Setup-0.3.0.exe)) { throw 'Windows installer missing' }
      - uses: actions/upload-artifact@v4
        with:
          name: BiliRemote-Windows-Installer
          path: artifacts/BiliRemote-Setup-*.exe
          retention-days: 14
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: BiliRemote-Chrome
          path: artifacts/BiliRemote-Chrome.zip
          retention-days: 14
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: BiliRemote-Windows-Portable
          path: artifacts/BiliRemote-Windows.zip
          retention-days: 14
          if-no-files-found: error
  ios:
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Generate and diagnose Windows-compatible certificates
        run: |
          dotnet run --project tests/BiliRemote.CertificateFixture -c Release -- artifacts/ios-transport-fixture
          swift scripts/diagnose-certificate.swift artifacts/ios-transport-fixture/server.cer artifacts/ios-transport-fixture/legacy.cer
      - name: Generate Xcode project
        run: |
          xcodebuild -version
          brew install xcodegen
          python3 scripts/ios-transport-fixture.py --prepare
          cd ios
          xcodegen generate
      - name: Run iOS tests
        run: |
          python3 scripts/ios-transport-fixture.py > artifacts/ios-transport-fixture/server.log 2>&1 &
          FIXTURE_PID=$!
          trap 'kill "$FIXTURE_PID"' EXIT
          DEVICE_ID=$(xcrun simctl list devices available --json | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for v in d["devices"].values() for x in v if x["name"].startswith("iPhone")))')
          xcodebuild test -project ios/BiliRemote.xcodeproj -scheme BiliRemote -destination "platform=iOS Simulator,id=$DEVICE_ID" -resultBundlePath artifacts/iOS-tests.xcresult CODE_SIGNING_ALLOWED=NO
      - name: Build Apple Watch companion for simulator
        run: xcodebuild -project ios/BiliRemote.xcodeproj -target BiliRemoteWatch -configuration Debug -sdk watchsimulator CODE_SIGNING_ALLOWED=NO
      - name: Check compact iPhone layout
        run: |
          SMALL_TYPE=$(xcrun simctl list devicetypes --json | python3 -c 'import json,sys; print(next(x["identifier"] for x in json.load(sys.stdin)["devicetypes"] if x["name"] == "iPhone SE (3rd generation)"))')
          SMALL_ID=$(xcrun simctl create 'BiliRemote compact' "$SMALL_TYPE")
          xcodebuild test -project ios/BiliRemote.xcodeproj -scheme BiliRemote -destination "platform=iOS Simulator,id=$SMALL_ID" -only-testing:BiliRemoteUITests -resultBundlePath artifacts/iOS-compact-tests.xcresult CODE_SIGNING_ALLOWED=NO
      - name: Archive unsigned device application
        run: |
          xcodebuild archive -project ios/BiliRemote.xcodeproj -scheme BiliRemote -configuration Release -destination 'generic/platform=iOS' -archivePath artifacts/BiliRemote.xcarchive CODE_SIGNING_ALLOWED=NO
          mkdir -p artifacts/ipa/Payload
          cp -R artifacts/BiliRemote.xcarchive/Products/Applications/BiliRemote.app artifacts/ipa/Payload/
          cd artifacts/ipa
          ditto -c -k --keepParent Payload ../BiliRemote-unsigned.ipa
      - name: Verify IPA platform and architecture
        run: python3 scripts/verify-ipa.py artifacts/BiliRemote-unsigned.ipa
      - name: Export UI test screenshots
        if: always()
        run: |
          xcrun xcresulttool export attachments --path artifacts/iOS-tests.xcresult --output-path artifacts/iOS-screenshots/standard
          if [ -d artifacts/iOS-compact-tests.xcresult ]; then
            xcrun xcresulttool export attachments --path artifacts/iOS-compact-tests.xcresult --output-path artifacts/iOS-screenshots/compact
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: BiliRemote-iOS-unsigned
          path: artifacts/BiliRemote-unsigned.ipa
          retention-days: 14
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: BiliRemote-iOS-screenshots
          path: artifacts/iOS-screenshots
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: BiliRemote-iOS-test-results
          path: artifacts/iOS*tests.xcresult
          retention-days: 7
