name: BiliRemote
options:
  bundleIdPrefix: dev.biliremote
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  developmentLanguage: zh-Hans
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    MARKETING_VERSION: "0.5.0"
    CURRENT_PROJECT_VERSION: "6"
    CODE_SIGN_STYLE: Manual
targets:
  BiliRemote:
    type: application
    platform: iOS
    sources:
      - BiliRemote
      - Shared
    dependencies:
      - target: BiliRemoteWatch
        embed: true
    settings:
      base:
        INFOPLIST_FILE: BiliRemote/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: dev.biliremote.ios
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
  BiliRemoteWatch:
    type: application
    platform: watchOS
    sources:
      - BiliRemoteWatch
      - Shared
      - BiliRemote/Models.swift
    settings:
      base:
        INFOPLIST_FILE: BiliRemoteWatch/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: dev.biliremote.ios.watchkitapp
        TARGETED_DEVICE_FAMILY: "4"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
  BiliRemoteTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - BiliRemoteTests
    dependencies:
      - target: BiliRemote
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  BiliRemoteUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - BiliRemoteUITests
    dependencies:
      - target: BiliRemote
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  BiliRemote:
    build:
      targets:
        BiliRemote: all
    test:
      targets:
        - BiliRemoteTests
        - BiliRemoteUITests
