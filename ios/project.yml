name: BiliRemote
options:
  bundleIdPrefix: dev.biliremote
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Manual
targets:
  BiliRemote:
    type: application
    platform: iOS
    sources:
      - BiliRemote
    info:
      path: BiliRemote/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.biliremote.ios
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
  BiliRemoteTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - BiliRemoteTests
    dependencies:
      - target: BiliRemote
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  BiliRemote:
    build:
      targets:
        BiliRemote: all
    test:
      targets:
        - BiliRemoteTests
